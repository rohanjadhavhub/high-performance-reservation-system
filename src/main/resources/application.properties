# ==========================================
# BookMyShow - Application Configuration
# ==========================================

spring.application.name=bookmyshow

# ---- Server ----
server.port=8080

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/bookmyshow
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Redis ----
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ---- Reservation ----
booking.reservation.ttl-seconds=300
booking.reservation.cleanup-interval-ms=30000

# ---- Outbox ----
booking.outbox.poll-interval-ms=5000
booking.outbox.batch-size=50

# ---- Rate Limiting (Token Bucket) ----
booking.rate-limit.capacity=100
booking.rate-limit.refill-tokens=10
booking.rate-limit.refill-interval-ms=1000

# ---- Reconciliation ----
booking.reconciliation.cron=0 */5 * * * *
booking.reconciliation.max-age-minutes=30

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
